name: tableside_pos
description: "A multi-tenant, responsive restaurant POS foundation."

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # 6.9.0 fixes the Android transaction-channel teardown regression in 6.8.0
  # that reports a spurious MissingPluginException after successful work.
  cloud_firestore: ^6.9.0
  http: ^1.5.0
  # 6.6.0 aligns Android Auth with firebase_core's Kotlin implementation.
  # Earlier 6.5.x builds refer to a Java-only Core field and fail to compile
  # when resolved alongside firebase_core 4.14.0.
  firebase_auth: ^6.6.0
  firebase_app_check: ^0.4.6
  firebase_core: ^4.13.0
  firebase_storage: ^13.4.6
  file_picker: ^12.0.0-beta.7
  flutter_riverpod: ^3.4.2
  intl: ^0.20.2
  esc_pos_utils_plus: ^2.0.4
  # Version 13 requires preview Android SDK 37. Version 12 supports the
  # Bluetooth runtime-permission API while remaining compatible with SDK 36.
  permission_handler: ^12.0.1
  print_bluetooth_thermal: ^1.2.2
  shared_preferences: ^2.5.5
  qr_flutter: ^4.1.0
  # Bundled alert tones provide the same kitchen-order audio on Android,
  # Windows and web. SystemSound is not implemented consistently by Android.
  audioplayers: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:

  uses-material-design: true

  assets:
    - assets/sounds/order_new.wav
    - assets/sounds/order_alert.wav


  # assets:
  #   - images/a_dot_burr.jpeg
  #   - images/a_dot_ham.jpeg
